<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355e4c"><title>随记 · 在这里存，在那里用</title><link rel="stylesheet" href="./style.css"></head><body>
<header><a class="brand" href="./"><b>↗</b> 随记 <small>QUICKNOTE</small></a><div><span id="sync">尚未登录</span> <button id="logout" hidden>退出</button></div></header>
<main><section class="intro"><span class="eyebrow">YOUR LITTLE SPACE, EVERYWHERE.</span><h1>在这里存，<br class="mobile">在那里用。</h1><p>一段文字，一张图片。让灵感跟上你的设备。</p></section>
<section id="setup" class="panel" hidden><h2>等待连接</h2><p>网页已准备好，部署者还需要配置 Supabase 项目。</p></section>
<section id="auth" class="panel" hidden><h2>打开你的随记</h2><p>在不同设备上，使用同一邮箱登录。</p><form id="login"><label>邮箱<input id="email" type="email" autocomplete="username" required placeholder="you@example.com"></label><label>密码<input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="至少 8 位"></label><div class="actions"><button class="primary" type="submit">登录</button><button type="button" id="signup">创建账号</button></div></form><p id="authMessage" role="status"></p></section>
<section id="workspace" hidden><form id="composer" class="panel"><div class="panel-title"><h2>记下此刻</h2><span id="counter">0 / 20000</span></div><textarea id="text" aria-label="记录内容" maxlength="20000" placeholder="写点什么，或把文字、链接粘贴到这里…"></textarea><div id="attachment"></div><div class="composer-bottom"><label class="file-button">＋ 添加图片<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label><span class="hint">也可以拖入图片</span><button id="save" class="primary">保存记录 ↗</button></div><p id="saveStatus" role="status"></p></form><div class="list-head"><h2>我的记录 <small id="count"></small></h2><input id="search" type="search" placeholder="搜索文字…" aria-label="搜索记录"></div><div id="records"></div><button id="more" hidden>加载更多</button></section>
<footer>少一点来回发送，多一点随手自如。</footer></main><div id="toast" role="status"></div><script type="module" src="./app.js"></script></body></html>
