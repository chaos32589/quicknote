<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355e4c"><title>随记</title><link rel="stylesheet" href="./style.css"></head><body>
<header><a class="brand" href="./"><b>↗</b> 随记 <small>QUICKNOTE</small></a><div><span id="sync">尚未登录</span> <button id="logout" hidden>锁定</button></div></header>
<main>
<section id="setup" class="panel" hidden><h2>等待连接</h2><p>网页已准备好，部署者还需要配置 Supabase 项目。</p></section>
<section id="auth" class="panel" hidden><div class="lock-symbol">⌑</div><h2 id="authTitle">输入访问码</h2><p id="authHint">请输入 6 位数字访问码。</p><form id="login"><label class="pin-wrap"><span class="pin-cells" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></span><span class="sr-only">6 位数字访问码</span><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="off" required aria-label="6 位数字访问码"></label><div id="initialSetup" hidden><label>再次输入访问码<input id="pinConfirm" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off"></label><label>一次性初始化码<input id="initCode" type="password" autocomplete="off" placeholder="仅首次设置需要"></label></div><button id="unlock" class="primary" type="submit">打开随记 ↗</button></form><p id="authMessage" role="status"></p></section>
<section id="workspace" hidden><form id="composer" class="panel"><div class="panel-title"><h2>记下此刻</h2><span id="counter">0 / 20000</span></div><textarea id="text" aria-label="记录内容" maxlength="20000" placeholder="写点什么，或把文字、链接粘贴到这里…"></textarea><div id="attachment"></div><div class="composer-bottom"><label class="file-button">＋ 添加图片<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label><label class="file-button">＋ 添加文件<input id="anyFile" type="file" hidden></label><span class="hint">图片 20 MB · 文件 50 MB</span><button id="save" class="primary">保存记录 ↗</button></div><p id="saveStatus" role="status"></p></form><div class="list-head"><h2>我的记录 <small id="count"></small></h2><div class="list-controls"><input id="search" type="search" placeholder="搜索文字…" aria-label="搜索记录"><button id="refresh" type="button" aria-label="刷新记录">↻ 刷新</button></div></div><div id="records"></div><button id="more" hidden>加载更多</button></section>
</main><div id="toast" role="status"></div><script type="module" src="./app.js"></script></body></html>
